# Ejecuta los tests de la plataforma en cada envío a GitHub.
name: Tests de la plataforma

on:
  push:
    paths: ["plataforma/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["plataforma/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    env:
      DJANGO_SECRET_KEY: clave-solo-para-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plataforma/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test
