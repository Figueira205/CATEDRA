<form method="post" action="{% url 'suscribirse' %}" class="boletin-form{% if compacto %} boletin-form--compacto{% endif %}" aria-label="Suscripción al boletín">
  {% csrf_token %}
  <input type="hidden" name="volver" value="{{ request.path }}">
  <div class="visually-hidden" aria-hidden="true"><label>No rellenar <input type="text" name="web" tabindex="-1" autocomplete="off"></label></div>
  {% if not compacto %}
  <div class="form-field">
    <label for="bol-nombre">Nombre</label>
    <input type="text" id="bol-nombre" name="nombre" autocomplete="name" maxlength="120">
  </div>
  {% endif %}
  <div class="form-field">
    <label for="bol-email{% if compacto %}-c{% endif %}">Correo electrónico <span class="req" aria-hidden="true">*</span></label>
    <input type="email" id="bol-email{% if compacto %}-c{% endif %}" name="email" required autocomplete="email">
  </div>
  <div class="form-check">
    <input type="checkbox" id="bol-consent{% if compacto %}-c{% endif %}" name="consentimiento" required>
    <label for="bol-consent{% if compacto %}-c{% endif %}">Acepto la <a href="/privacidad/">política de privacidad</a>.</label>
  </div>
  <button type="submit" class="btn btn--light">Suscribirme <span class="arr" aria-hidden="true">→</span></button>
</form>
